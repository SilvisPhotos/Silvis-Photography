<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landschaftsfotos — Silvis Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6F0; --ink:#2B2622; --ink-soft:#5B534C;
    --rose:#C9A79C; --rose-line:#3a332d; --panel:#FFFDFB;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'EB Garamond', serif; }
  header{ text-align:center; padding:60px 20px 20px; }
  header img{ height:60px; margin-bottom:20px; }
  header h1{ font-family:'Cormorant Garamond', serif; font-weight:400; font-style:italic; font-size:clamp(30px, 5vw, 44px); }
  header p{ color:var(--ink-soft); font-size:16px; margin-top:10px; max-width:520px; margin-left:auto; margin-right:auto; }

  .grid{ max-width:1300px; margin:40px auto 100px; padding:0 6vw; display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .karte{ background:var(--panel); border:1px solid var(--rose-line); overflow:hidden; }
  .karte img{ width:100%; aspect-ratio:3/2; object-fit:cover; display:block; }
  .karte-info{ padding:18px 20px 22px; text-align:center; }
  .karte-info .titel{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:20px; }
  .karte-info .beschreibung{ margin-top:6px; font-size:14px; color:var(--ink-soft); }
  .karte-info .preis{ margin-top:6px; font-size:17px; color:var(--rose); }
  .karte-info button{
    margin-top:14px; padding:11px 26px; background:var(--ink); color:var(--cream); border:none; cursor:pointer;
    font-family:'Cormorant Garamond', serif; font-size:16px; letter-spacing:0.04em; transition:background .25s ease;
  }
  .karte-info button:hover{ background:var(--rose); }
  .karte-info button:disabled{ opacity:0.6; cursor:wait; }
  .karte-info .anfragen-link{
    display:inline-block; margin-top:10px; font-size:14px; color:var(--ink-soft);
    text-decoration:none; border-bottom:1px solid var(--rose);
  }
  .karte-info .anfragen-link:hover{ color:var(--ink); }

  .kontakt-bereich{
    max-width:520px; margin:20px auto 90px; padding:34px 32px; text-align:center;
    background:var(--panel); border:1px solid var(--rose-line);
  }
  .kontakt-bereich h2{ font-family:'Cormorant Garamond', serif; font-weight:400; font-style:italic; font-size:24px; margin-bottom:6px; }
  .kontakt-bereich p.sub{ color:var(--ink-soft); font-size:15px; margin-bottom:20px; }
  .kontakt-bereich .zeile{ font-size:16px; margin-bottom:10px; }
  .kontakt-bereich .zeile a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rose); }

  .leer{ text-align:center; color:var(--ink-soft); padding:60px 20px; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:19px; }

  .karte img{ cursor:zoom-in; }

  .lightbox{ display:none; position:fixed; inset:0; background:rgba(20,19,15,0.94); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .lightbox.offen{ display:flex; }
  .lightbox img{ max-width:92vw; max-height:88vh; object-fit:contain; cursor:default; }
  .lightbox-close{ position:absolute; top:20px; right:26px; color:#fff; font-size:34px; cursor:pointer; background:none; border:none; line-height:1; }
</style>
</head>
<body>

<header>
  <img src="images/logo.png" alt="Silvis Photography">
  <h1>Landschaftsfotos zum Download</h1>
  <p>Schreib mir einfach bei Interesse — ich schicke dir Rechnung und Download nach Zahlungseingang zu.</p>
</header>

<div class="grid" id="grid">
  <p class="leer">Fotos werden geladen …</p>
</div>

<div class="kontakt-bereich">
  <h2>Fragen zu einem Foto?</h2>
  <p class="sub">Melde dich einfach direkt bei mir.</p>
  <div class="zeile">📧 <a href="mailto:kontakt@silvis-photography.com">kontakt@silvis-photography.com</a></div>
  <div class="zeile">📞 <a href="tel:+4915147669310">0151 47669310</a></div>
  <div class="zeile">📷 <a href="https://instagram.com/silvisphotogallery" target="_blank">@silvisphotogallery</a></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script type="module">
  import { db } from "./galerie-tool/firebase-config.js";
  import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  function anfrageLink(titel, preis) {
    const betreff = `Anfrage: ${titel}`;
    const text = `Hallo Silvi,

ich interessiere mich für dein Foto "${titel}" (${preis.toFixed(2)} €).

Kannst du mir bitte sagen, wie es weitergeht?

Liebe Grüße`;
    return `mailto:kontakt@silvis-photography.com?subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(text)}`;
  }

  async function kaufen(fotoId, button) {
    button.disabled = true;
    button.textContent = 'Einen Moment …';
    try {
      const antwort = await fetch('https://createcheckoutsession-ke2pteowva-uc.a.run.app', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({fotoId})
      });
      const daten = await antwort.json();
      if (daten.url) {
        window.location.href = daten.url;
      } else {
        throw new Error(daten.error || 'Unbekannter Fehler');
      }
    } catch (e) {
      alert('Der Kauf konnte gerade nicht gestartet werden. Bitte versuch es später nochmal.');
      button.disabled = false;
      button.textContent = 'Kaufen';
    }
  }
  window.kaufen = kaufen;

  async function fotosLaden() {
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    try {
      const q = query(collection(db, 'landschaftsfotos'), orderBy('erstelltAm', 'desc'));
      const snapshot = await getDocs(q);
      if (snapshot.empty) {
        grid.innerHTML = '<p class="leer">Aktuell sind keine Fotos eingestellt — schau bald wieder vorbei!</p>';
        return;
      }
      grid.innerHTML = '';
      snapshot.forEach(docSnap => {
        const f = docSnap.data();
        const karte = document.createElement('div');
        karte.className = 'karte';
        karte.innerHTML = `
          <img src="${f.bildUrl}" alt="${f.titel}">
          <div class="karte-info">
            <div class="titel">${f.titel}</div>
            ${f.beschreibung ? `<div class="beschreibung">${f.beschreibung}</div>` : ''}
            <div class="preis">${f.preis.toFixed(2)} €</div>
            <button type="button" class="kaufen-btn" data-id="${docSnap.id}">Kaufen</button>
            <br>
            <a class="anfragen-link" href="${anfrageLink(f.titel, f.preis)}">Erst anfragen</a>
          </div>
        `;
        grid.appendChild(karte);
        karte.querySelector('.kaufen-btn').addEventListener('click', (e) => {
          kaufen(docSnap.id, e.target);
        });
        karte.querySelector('img').addEventListener('click', () => {
          lightboxImg.src = f.bildUrl;
          lightbox.classList.add('offen');
        });
      });
    } catch (e) {
      grid.innerHTML = '<p class="leer">Die Fotos konnten gerade nicht geladen werden.</p>';
    }
  }
  fotosLaden();

  document.getElementById('lightbox-close').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('offen');
  });
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') e.target.classList.remove('offen');
  });
</script>
</body>
</html>
