<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Silvis Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#f3ead9;
    --sand-deep:#e9dcc3;
    --moss:#5c6b4f;
    --moss-deep:#3f4a37;
    --rose:#c98f76;
    --ink:#2b2a24;
    --line: rgba(43,42,36,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(rgba(243,234,217,0.75), rgba(243,234,217,0.75)),
      url('../../images/bg-texture.jpg');
    background-size:cover;
    background-position:top center;
    background-repeat:repeat-y;
    min-height:100vh;
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    line-height:1.6;
  }
  .logo{ text-align:center; padding:30px 0 10px; }
  .logo img{ height:60px; }
  .wrap{ max-width:700px; margin:0 auto; padding:0 24px 60px; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:28px; color:var(--ink); margin-bottom:24px; }
  h2{ font-family:'Fraunces', serif; font-weight:500; font-size:20px; color:var(--moss); margin:36px 0 14px; }
  label{ display:block; margin-top:16px; font-size:14px; letter-spacing:0.02em; color:var(--moss-deep); }
  input{ width:100%; padding:12px; margin-top:6px; border:1px solid var(--line); border-radius:6px; background:white; font-family:'Jost',sans-serif; font-size:15px; box-sizing:border-box; }
  input:focus{ outline:none; border-color:var(--moss); }
  button{ margin-top:24px; padding:13px 28px; background:var(--moss); color:white; border:none; border-radius:6px; cursor:pointer; font-family:'Jost',sans-serif; font-size:15px; letter-spacing:0.02em; transition:background .2s; }
  button:hover{ background:var(--moss-deep); }
  .card{ background:white; border-radius:10px; padding:32px; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
  .erfolg{ background:var(--sand-deep); border-left:3px solid var(--rose); padding:16px 18px; border-radius:4px; margin:20px 0; word-break:break-all; font-size:14px; }
  .erfolg a{ color:var(--moss); }
  .erfolg .mail-btn{
    display:inline-block; margin-top:14px; margin-right:8px; padding:10px 20px; background:var(--moss); color:white;
    border-radius:6px; text-decoration:none; font-size:14px; word-break:normal; border:none; cursor:pointer; font-family:'Jost',sans-serif;
  }
  .erfolg .mail-btn:hover{ background:var(--moss-deep); }
  .erfolg .kopier-btn{
    display:inline-block; margin-top:14px; padding:10px 20px; background:white; color:var(--moss);
    border:1px solid var(--moss); border-radius:6px; cursor:pointer; font-size:14px; font-family:'Jost',sans-serif; word-break:normal;
  }
  .erfolg .kopier-btn:hover{ background:var(--sand-deep); }
  .qr-btn{
    display:inline-block; margin-top:14px; padding:10px 20px; background:white; color:var(--moss);
    border:1px solid var(--moss); border-radius:6px; cursor:pointer; font-size:14px; font-family:'Jost',sans-serif;
  }
  .qr-btn:hover{ background:var(--sand-deep); }
  .badge{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; letter-spacing:0.02em; }
  .badge.aktiv{ background:#e3ebe0; color:var(--moss-deep); }
  .badge.abgelaufen{ background:#f4dedb; color:#a3453b; }
  .meta-zeile{ font-size:12px; color:var(--moss-deep); margin-top:4px; }
  .passwort-zeile{ font-size:12px; color:var(--moss-deep); margin-top:2px; }
  .passwort-zeile button{ margin:0 0 0 4px; padding:0; background:none; color:var(--moss); border:none; font-size:12px; text-decoration:underline; cursor:pointer; }

  .qr-modal{
    display:none; position:fixed; inset:0; background:rgba(43,42,36,0.5);
    align-items:center; justify-content:center; z-index:100;
  }
  .qr-modal.offen{ display:flex; }
  .qr-modal-box{
    background:white; border-radius:10px; padding:30px; text-align:center; max-width:300px;
  }
  .qr-modal-box img{ width:220px; height:220px; display:block; margin:0 auto 16px; }
  .qr-modal-box a{ font-size:13px; color:var(--moss); }
  .qr-modal-close{ margin-top:16px; background:var(--moss); color:white; border:none; border-radius:6px; padding:9px 20px; cursor:pointer; font-family:'Jost',sans-serif; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  th{ text-align:left; padding:10px 8px; font-size:13px; letter-spacing:0.03em; text-transform:uppercase; color:var(--moss-deep); border-bottom:1px solid var(--line); }
  td{ padding:12px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  td a{ color:var(--moss); text-decoration:none; }
  td a:hover{ text-decoration:underline; }
  .link-text{ font-size:11px; color:var(--moss-deep); word-break:break-all; margin-top:4px; }
  .aktionen{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .loeschen-btn{ color:#a3453b; cursor:pointer; background:none; border:none; padding:0; font-family:'Jost',sans-serif; font-size:13px; margin:0; text-decoration:underline; }
  .loeschen-btn:hover{ color:#7a332c; background:none; }
  .aktion-btn{ color:var(--moss); cursor:pointer; background:none; border:none; padding:0; font-family:'Jost',sans-serif; font-size:13px; margin:0; text-decoration:underline; }
  .aktion-btn:hover{ color:var(--moss-deep); background:none; }
  #login-box{ max-width:380px; margin:80px auto; text-align:center; }
  #login-box p{ color:var(--moss-deep); margin-bottom:20px; font-size:14px; }
  #login-fehler{ color:#a3453b; font-size:13px; margin-top:12px; }
  .admin-nav{ text-align:center; padding:14px 0 0; font-size:13px; }
  .admin-nav a{ color:var(--moss-deep); text-decoration:none; }
  .admin-nav a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="logo"><img src="../../images/logo.png" alt="Silvis Photography"></div>
<div class="admin-nav"><a href="landschaften-admin.html">Zur Shop-Verwaltung →</a></div>

<div id="login-box" class="wrap">
  <div class="card">
    <h1 style="text-align:center;">Admin-Login</h1>
    <p>Nur für dich — trag deine E-Mail und dein Passwort ein.</p>
    <input type="email" id="login-email" placeholder="E-Mail">
    <input type="password" id="login-passwort" placeholder="Passwort" style="margin-top:12px;">
    <button id="login-btn" style="width:100%;">Login</button>
    <p id="login-fehler"></p>
  </div>
</div>

<div id="admin-bereich" class="wrap" style="display:none;">
  <h1>Neue Galerie erstellen</h1>

  <div id="erfolg-box" class="erfolg" style="display:none;"></div>

  <div class="card">
    <form id="galerie-form">
      <label>Titel der Galerie</label>
      <input type="text" id="titel" placeholder="z.B. Benis Hochzeit" required>

      <label>Kundenname</label>
      <input type="text" id="kunde-name" placeholder="z.B. Beni">

      <label>Galerie-Passwort</label>
      <input type="text" id="galerie-passwort" placeholder="z.B. Beni2026" required>

      <label>Ablaufdatum (optional)</label>
      <input type="date" id="ablauf-datum">

      <button type="submit">Galerie anlegen</button>
    </form>
  </div>

  <h2>Bestehende Galerien</h2>
  <table id="galerien-liste">
    <tr><th>Titel</th><th>Kunde</th><th>Link</th></tr>
  </table>
</div>

<div class="qr-modal" id="qr-modal">
  <div class="qr-modal-box">
    <img id="qr-modal-img" src="" alt="QR-Code">
    <a id="qr-modal-download" href="" download="galerie-qr-code.png">Als Bild herunterladen</a>
    <br>
    <button class="qr-modal-close" onclick="document.getElementById('qr-modal').classList.remove('offen')">Schließen</button>
  </div>
</div>

<script type="module">
  import { auth, db, storage } from "../firebase-config.js";
  import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { collection, addDoc, getDocs, getDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { ref, listAll, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value;
    const passwort = document.getElementById('login-passwort').value;
    try {
      await signInWithEmailAndPassword(auth, email, passwort);
    } catch (err) {
      document.getElementById('login-fehler').textContent = 'Login fehlgeschlagen: ' + err.message;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('admin-bereich').style.display = 'block';
      galerienLaden();
    }
  });

  async function einfacherHash(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function slugErstellen(titel) {
    const basis = titel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    const zufall = Math.random().toString(36).substring(2, 6);
    return `${basis}-${zufall}`;
  }

  // Schöner Link fürs Verschicken — landet über die 404.html-Weiterleitung
  // automatisch bei der echten Galerie-Seite
  function schoenerLink(slug) {
    return `${window.location.origin}/galerie/${slug}`;
  }

  function mailtoLink(link, passwort, kundeName, titel) {
    return `mailto:?subject=${encodeURIComponent(mailBetreff(titel))}&body=${encodeURIComponent(mailText(link, passwort, kundeName))}`;
  }

  function mailBetreff(titel) {
    return `Deine Fotogalerie ist bereit — ${titel}`;
  }

  function mailText(link, passwort, kundeName) {
    const anrede = kundeName ? `Hallo ${kundeName}` : 'Hallo';
    return `${anrede},

deine Fotos sind fertig! Hier geht's zu deiner Galerie:
${link}

Passwort: ${passwort}

Wähle einfach deine Lieblingsbilder mit dem Herz-Symbol aus.

Liebe Grüße
Silvi`;
  }

  window.textKopieren = async function (btn, text) {
    try {
      await navigator.clipboard.writeText(text);
      const alt = btn.textContent;
      btn.textContent = '✓ Kopiert!';
      setTimeout(() => { btn.textContent = alt; }, 1800);
    } catch (e) {
      alert('Kopieren hat nicht geklappt — bitte den Text manuell markieren.');
    }
  };

  window.qrAnzeigen = function (link) {
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(link)}`;
    document.getElementById('qr-modal-img').src = qrUrl;
    document.getElementById('qr-modal-download').href = qrUrl;
    document.getElementById('qr-modal').classList.add('offen');
  };

  function datumFormatieren(datumWert) {
    if (!datumWert) return '';
    const datum = datumWert.toDate ? datumWert.toDate() : new Date(datumWert);
    return datum.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function ablaufStatus(ablaufdatum) {
    if (!ablaufdatum) return '<span class="meta-zeile">Kein Ablaufdatum</span>';
    const datum = ablaufdatum.toDate ? ablaufdatum.toDate() : new Date(ablaufdatum);
    const abgelaufen = datum.getTime() < Date.now();
    return `<span class="badge ${abgelaufen ? 'abgelaufen' : 'aktiv'}">${abgelaufen ? 'abgelaufen' : 'läuft bis'} ${datumFormatieren(ablaufdatum)}</span>`;
  }

  document.getElementById('galerie-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const titel = document.getElementById('titel').value;
    const kundeName = document.getElementById('kunde-name').value;
    const passwort = document.getElementById('galerie-passwort').value;
    const ablaufWert = document.getElementById('ablauf-datum').value;
    const slug = slugErstellen(titel);
    const passwortHash = await einfacherHash(passwort);

    await addDoc(collection(db, 'galerien'), {
      slug, titel, kundeName, passwortHash,
      passwortKlartext: passwort,
      ablaufdatum: ablaufWert ? new Date(ablaufWert) : null,
      downloadFreigegeben: false,
      erstelltAm: serverTimestamp()
    });

    const link = schoenerLink(slug);
    const box = document.getElementById('erfolg-box');
    box.style.display = 'block';
    box.innerHTML = `<strong>Galerie erstellt!</strong><br>Link: <a href="${link}">${link}</a><br>Passwort: ${passwort}<br>
      <a class="mail-btn" href="${mailtoLink(link, passwort, kundeName, titel)}">📧 Per E-Mail senden</a>
      <button type="button" class="kopier-btn" id="kopier-btn-erfolg">📋 Text kopieren</button>
      <button type="button" class="qr-btn" id="qr-btn-erfolg">🔳 QR-Code</button>`;
    document.getElementById('kopier-btn-erfolg').addEventListener('click', (e) => {
      textKopieren(e.target, mailText(link, passwort, kundeName));
    });
    document.getElementById('qr-btn-erfolg').addEventListener('click', () => qrAnzeigen(link));

    document.getElementById('galerie-form').reset();
    galerienLaden();
  });

  async function galerieLoeschen(galerieId, titel) {
    if (!confirm(`Galerie "${titel}" wirklich komplett löschen? Das kann nicht rückgängig gemacht werden.`)) return;

    // 1. Alle Bilder-Einträge in der Unterkollektion löschen
    const bilderSnapshot = await getDocs(collection(db, 'galerien', galerieId, 'bilder'));
    for (const bildDoc of bilderSnapshot.docs) {
      await deleteDoc(bildDoc.ref);
    }

    // 2. Dateien im Storage löschen (Original + Vorschau)
    for (const ordner of ['original', 'preview']) {
      try {
        const ordnerRef = ref(storage, `galerien/${galerieId}/${ordner}`);
        const liste = await listAll(ordnerRef);
        for (const item of liste.items) {
          await deleteObject(item);
        }
      } catch (e) { /* Ordner existiert evtl. nicht, kein Problem */ }
    }

    // 3. Galerie-Dokument selbst löschen
    await deleteDoc(doc(db, 'galerien', galerieId));

    galerienLaden();
  }
  window.galerieLoeschen = galerieLoeschen;

  async function galerienLaden() {
    const q = query(collection(db, 'galerien'), orderBy('erstelltAm', 'desc'));
    const snapshot = await getDocs(q);
    const tabelle = document.getElementById('galerien-liste');
    tabelle.innerHTML = '<tr><th>Titel</th><th>Kunde</th><th>Links</th><th>Aktionen</th></tr>';
    snapshot.forEach(docSnap => {
      const g = docSnap.data();
      const galerieId = docSnap.id;
      const basisPfad = window.location.pathname.substring(0, window.location.pathname.indexOf('admin/'));
      const ansehenLink = schoenerLink(g.slug);
      const uploadLink = `upload.html?g=${g.slug}`;
      const echtesPasswort = g.passwortKlartext || null;
      const mailLink = mailtoLink(ansehenLink, echtesPasswort || '(kein Passwort gespeichert)', g.kundeName, g.titel);
      const zuletztAngesehenText = g.zuletztAngesehenAm
        ? `Zuletzt angesehen: ${datumFormatieren(g.zuletztAngesehenAm)}`
        : 'Noch nicht angesehen';

      const zeile = document.createElement('tr');
      zeile.innerHTML = `
        <td>${g.titel}</td>
        <td>${g.kundeName || ''}</td>
        <td>
          <div class="link-text">${ansehenLink}</div>
          <div class="passwort-zeile">
            Passwort: <span class="pw-versteckt">••••••</span><span class="pw-klartext" style="display:none;">${echtesPasswort || 'nicht gespeichert'}</span>
            ${echtesPasswort ? '<button type="button" class="pw-toggle">anzeigen</button>' : ''}
          </div>
          <div class="meta-zeile">${ablaufStatus(g.ablaufdatum)}</div>
          <div class="meta-zeile">${zuletztAngesehenText}</div>
        </td>
        <td>
          <div class="aktionen">
            <a href="${ansehenLink}" target="_blank">ansehen</a>
            <a href="${uploadLink}">Bilder hochladen</a>
            <a href="auswahl.html?g=${g.slug}">Auswahl ansehen</a>
            <a href="${mailLink}">📧 senden</a>
            <button class="aktion-btn kopier-link-btn" type="button">📋 Link kopieren</button>
            <button class="aktion-btn kopier-text-btn" type="button">📋 Text kopieren</button>
            <button class="aktion-btn qr-zeile-btn" type="button">🔳 QR-Code</button>
            <button class="loeschen-btn" data-id="${galerieId}" data-titel="${g.titel}">löschen</button>
          </div>
        </td>
      `;
      zeile.querySelector('.kopier-link-btn').addEventListener('click', (e) => {
        textKopieren(e.target, ansehenLink);
      });
      zeile.querySelector('.kopier-text-btn').addEventListener('click', (e) => {
        textKopieren(e.target, mailText(ansehenLink, echtesPasswort || '(kein Passwort gespeichert)', g.kundeName));
      });
      zeile.querySelector('.qr-zeile-btn').addEventListener('click', () => qrAnzeigen(ansehenLink));
      const pwToggle = zeile.querySelector('.pw-toggle');
      if (pwToggle) {
        pwToggle.addEventListener('click', () => {
          const versteckt = zeile.querySelector('.pw-versteckt');
          const klartext = zeile.querySelector('.pw-klartext');
          const zeigen = klartext.style.display === 'none';
          klartext.style.display = zeigen ? 'inline' : 'none';
          versteckt.style.display = zeigen ? 'none' : 'inline';
          pwToggle.textContent = zeigen ? 'verbergen' : 'anzeigen';
        });
      }
      tabelle.appendChild(zeile);
    });

    document.querySelectorAll('.loeschen-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        galerieLoeschen(btn.dataset.id, btn.dataset.titel);
      });
    });
  }
</script>
</body>
</html>
