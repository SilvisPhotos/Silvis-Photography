<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin — Galerie erstellen</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #2B2A24; }
  h1 { color: #5C6B4F; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #D9D2C2; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 12px 24px; background: #5C6B4F; color: white; border: none; border-radius: 4px; cursor: pointer; }
  .erfolg { background: #F3EAD9; padding: 16px; border-radius: 4px; margin: 20px 0; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #D9D2C2; }
  #login-box { max-width: 350px; margin: 100px auto; text-align: center; }
</style>
</head>
<body>

<div id="login-box">
  <h2>Admin-Login</h2>
  <input type="email" id="login-email" placeholder="E-Mail">
  <input type="password" id="login-passwort" placeholder="Passwort">
  <button id="login-btn">Login</button>
  <p id="login-fehler" style="color:red;"></p>
</div>

<div id="admin-bereich" style="display:none;">
  <h1>Neue Galerie erstellen</h1>

  <div id="erfolg-box" class="erfolg" style="display:none;"></div>

  <form id="galerie-form">
    <label>Titel der Galerie</label>
    <input type="text" id="titel" placeholder="z.B. Benis Hochzeit" required>

    <label>Kundenname</label>
    <input type="text" id="kunde-name" placeholder="z.B. Beni">

    <label>Galerie-Passwort</label>
    <input type="text" id="galerie-passwort" placeholder="z.B. Beni2026" required>

    <button type="submit">Galerie anlegen</button>
  </form>

  <h2>Bestehende Galerien</h2>
  <table id="galerien-liste">
    <tr><th>Titel</th><th>Kunde</th><th>Link</th></tr>
  </table>
</div>

<script type="module">
  import { auth, db } from "../firebase-config.js";
  import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // Login
  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value;
    const passwort = document.getElementById('login-passwort').value;
    try {
      await signInWithEmailAndPassword(auth, email, passwort);
    } catch (err) {
      document.getElementById('login-fehler').textContent = 'Login fehlgeschlagen: ' + err.message;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('admin-bereich').style.display = 'block';
      galerienLaden();
    }
  });

  // Einfaches Hashing fürs Galerie-Passwort (im Browser, KEIN Ersatz für echte Verschlüsselung,
  // aber verhindert Klartext-Speicherung in der Datenbank)
  async function einfacherHash(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function slugErstellen(titel) {
    const basis = titel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    const zufall = Math.random().toString(36).substring(2, 6);
    return `${basis}-${zufall}`;
  }

  document.getElementById('galerie-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const titel = document.getElementById('titel').value;
    const kundeName = document.getElementById('kunde-name').value;
    const passwort = document.getElementById('galerie-passwort').value;
    const slug = slugErstellen(titel);
    const passwortHash = await einfacherHash(passwort);

    await addDoc(collection(db, 'galerien'), {
      slug, titel, kundeName, passwortHash,
      downloadFreigegeben: false,
      erstelltAm: serverTimestamp()
    });

  const link = `${window.location.origin}${window.location.pathname.replace('admin/index.html', '')}galerie/ansehen.html?g=${slug}`;
    const box = document.getElementById('erfolg-box');
    box.style.display = 'block';
    box.innerHTML = `Galerie erstellt!<br>Link: <a href="${link}">${link}</a><br>Passwort: ${passwort}`;

    document.getElementById('galerie-form').reset();
    galerienLaden();
  });

  async function galerienLaden() {
    const q = query(collection(db, 'galerien'), orderBy('erstelltAm', 'desc'));
    const snapshot = await getDocs(q);
    const tabelle = document.getElementById('galerien-liste');
    tabelle.innerHTML = '<tr><th>Titel</th><th>Kunde</th><th>Link</th></tr>';
    snapshot.forEach(doc => {
      const g = doc.data();
      const uploadLink = `upload.html?g=${g.slug}`;
      const ansehenLink = `../galerie/ansehen.html?g=${g.slug}`;
      tabelle.innerHTML += `<tr><td>${g.titel}</td><td>${g.kundeName || ''}</td>
        <td><a href="${ansehenLink}">ansehen</a> | <a href="${uploadLink}">Bilder hochladen</a></td></tr>`;
    });
  }
</script>
</body>
</html>
