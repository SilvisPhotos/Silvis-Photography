<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilder hochladen — Silvis Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#f3ead9; --sand-deep:#e9dcc3; --moss:#5c6b4f; --moss-deep:#3f4a37;
    --rose:#c98f76; --ink:#2b2a24; --line: rgba(43,42,36,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(rgba(243,234,217,0.75), rgba(243,234,217,0.75)),
     url('../../images/bg-texture.jpg');
    background-size:cover;
    background-position:top center;
    background-repeat:repeat-y;
    min-height:100vh;
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:300;
  }
  .logo{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:22px; color:var(--moss); text-align:center; padding:30px 0 10px; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 24px 60px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin-bottom:6px; }
  #galerie-titel{ color:var(--moss-deep); font-size:14px; margin-bottom:24px; }
  .upload-box{ background:white; border:2px dashed var(--line); padding:40px; text-align:center; border-radius:10px; margin:20px 0; }
  .upload-box p{ color:var(--moss-deep); font-size:13px; margin-top:10px; }
  button{ padding:13px 28px; background:var(--moss); color:white; border:none; border-radius:6px; cursor:pointer; font-family:'Jost',sans-serif; font-size:15px; margin-top:16px; }
  button:hover{ background:var(--moss-deep); }
  .fortschritt{ margin-top:16px; color:var(--moss-deep); font-size:14px; }
  h2{ font-family:'Fraunces',serif; font-weight:500; font-size:19px; color:var(--moss); margin:36px 0 14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .grid img{ width:100%; border-radius:6px; display:block; }
</style>
</head>
<body>
  <div class="logo">Silvis Photography</div>
  <div class="wrap">
    <h1>Bilder hochladen</h1>
    <p id="galerie-titel"></p>

    <div class="upload-box">
      <input type="file" id="datei-input" multiple accept="image/jpeg,image/png">
      <p>Mehrere Bilder gleichzeitig auswählbar — Wasserzeichen wird automatisch erzeugt.</p>
    </div>
    <button id="upload-btn">Hochladen</button>
    <div class="fortschritt" id="fortschritt"></div>

    <h2 id="bilder-anzahl">Bereits hochgeladen</h2>
    <div class="grid" id="bilder-grid"></div>
  </div>

  <canvas id="wz-canvas" style="display:none;"></canvas>

<script type="module">
  import { db, storage } from "../firebase-config.js";
  import { collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('g');
  let galerieId = null;

  async function galerieFinden() {
    const q = query(collection(db, 'galerien'), where('slug', '==', slug));
    const snapshot = await getDocs(q);
    if (snapshot.empty) { alert('Galerie nicht gefunden.'); return; }
    const doc = snapshot.docs[0];
    galerieId = doc.id;
    document.getElementById('galerie-titel').textContent = doc.data().titel;
    bilderLaden();
  }
  galerieFinden();

  function wasserzeichenErstellen(bild) {
    return new Promise((resolve) => {
      const canvas = document.getElementById('wz-canvas');
      canvas.width = bild.width; canvas.height = bild.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bild, 0, 0);
      ctx.font = `${Math.floor(bild.width / 20)}px sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.textAlign = 'center';
      ctx.save();
      ctx.translate(bild.width / 2, bild.height / 2);
      ctx.rotate(-Math.PI / 6);
      for (let y = -bild.height; y < bild.height; y += bild.height / 4) {
        ctx.fillText('SILVIS PHOTOGRAPHY', 0, y);
      }
      ctx.restore();
      canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
    });
  }

  function bildLaden(datei) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = URL.createObjectURL(datei);
    });
  }

  document.getElementById('upload-btn').addEventListener('click', async () => {
    const dateien = document.getElementById('datei-input').files;
    if (!dateien.length) return alert('Bitte Dateien auswählen.');
    const fortschrittEl = document.getElementById('fortschritt');

    for (let i = 0; i < dateien.length; i++) {
      const datei = dateien[i];
      fortschrittEl.textContent = `Lade hoch: ${i + 1}/${dateien.length}...`;
      const bild = await bildLaden(datei);
      const wzBlob = await wasserzeichenErstellen(bild);
      const dateiId = crypto.randomUUID();
      const originalRef = ref(storage, `galerien/${galerieId}/original/${dateiId}.jpg`);
      const previewRef = ref(storage, `galerien/${galerieId}/preview/${dateiId}.jpg`);
      await uploadBytes(originalRef, datei);
      await uploadBytes(previewRef, wzBlob);
      const previewUrl = await getDownloadURL(previewRef);
      await addDoc(collection(db, 'galerien', galerieId, 'bilder'), {
        dateiId, previewUrl, hochgeladenAm: serverTimestamp()
      });
    }
    fortschrittEl.textContent = 'Fertig!';
    bilderLaden();
  });

  async function bilderLaden() {
    const snapshot = await getDocs(collection(db, 'galerien', galerieId, 'bilder'));
    const grid = document.getElementById('bilder-grid');
    grid.innerHTML = '';
    snapshot.forEach(doc => {
      grid.innerHTML += `<img src="${doc.data().previewUrl}" alt="">`;
    });
    document.getElementById('bilder-anzahl').textContent = `${snapshot.size} Bilder in dieser Galerie`;
  }
</script>
</body>
</html>
