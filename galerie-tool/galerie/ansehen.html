<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deine Galerie — Silvis Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#f3ead9; --sand-deep:#e9dcc3; --moss:#5c6b4f; --moss-deep:#3f4a37;
    --rose:#c98f76; --ink:#2b2a24; --line: rgba(43,42,36,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#ffffff; min-height:100vh; color:var(--ink); font-family:'Jost',sans-serif; font-weight:300; }

  .login-body{
    background:
      linear-gradient(rgba(243,234,217,0.75), rgba(243,234,217,0.75)),
      url('../../images/bg-texture.jpg');
    background-size:cover; background-position:top center; background-repeat:repeat-y;
    min-height:100vh;
  }
  .logo{ text-align:center; padding:40px 0 20px; }
  .logo img{ height:70px; }

  .login-box{ max-width:380px; margin:60px auto; text-align:center; background:white; padding:36px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
  .login-box .begruessung{ font-family:'Fraunces',serif; font-style:italic; color:var(--rose); font-size:15px; margin-bottom:6px; }
  .login-box h1{ font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin-bottom:10px; }
  .login-box p{ color:var(--moss-deep); font-size:14px; margin-bottom:16px; }
  .login-box input{ width:100%; padding:12px; border:1px solid var(--line); border-radius:6px; font-family:'Jost',sans-serif; font-size:15px; box-sizing:border-box; }
  .login-box button{ margin-top:14px; padding:12px 24px; background:var(--moss); color:white; border:none; border-radius:6px; cursor:pointer; width:100%; font-family:'Jost',sans-serif; font-size:15px; }
  .login-box button:hover{ background:var(--moss-deep); }
  #fehler{ color:#a3453b; font-size:13px; margin-top:10px; }

  /* --- Galerie-Ansicht (nach Login), scrappbook-artiges Layout --- */
  .galerie-ansicht{ display:none; }

  .topbar{ text-align:center; padding:24px 0 8px; }
  .topbar img{ height:44px; }

  .haupt{ display:flex; }

  .sidebar{
    width:64px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; gap:26px;
    padding-top:20px; border-right:1px solid var(--line);
    min-height:calc(100vh - 90px);
  }
  .sidebar .icon{ font-size:20px; color:#8a8272; cursor:pointer; transition:color .15s; }
  .sidebar .icon:hover{ color:var(--moss-deep); }
  .sidebar .icon.aktiv{ color:var(--moss); }

  .inhalt{ flex:1; padding:26px 40px 80px; }
  .titel-zeile{ display:flex; align-items:baseline; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
  .titel-zeile h1{ font-family:'Fraunces',serif; font-weight:500; font-style:italic; font-size:24px; color:var(--ink); }
  .titel-zeile .kundenname{ color:#9a9384; font-size:15px; }

  .hero{ display:none; position:relative; margin:0 0 30px; border-radius:10px; overflow:hidden; }
  .hero img{ width:100%; max-height:420px; object-fit:cover; display:block; }
  .hero-overlay{ position:absolute; bottom:0; left:0; right:0; padding:30px 26px 20px; background:linear-gradient(transparent, rgba(0,0,0,0.6)); }
  .hero-overlay h1{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:26px; color:white; margin:0; }
  .hero-overlay p{ color:rgba(255,255,255,0.85); font-size:14px; margin-top:4px; }

  .hinweis{ color:var(--moss-deep); font-size:13px; margin-bottom:24px; letter-spacing:0.02em; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:6px;
  }
  .bild-wrap{ position:relative; overflow:hidden; cursor:pointer; background:#f4f3f0; }
  .bild-wrap img{ width:100%; height:100%; object-fit:cover; aspect-ratio:2/3; display:block; }

  .bild-wrap .overlay-btn{
    position:absolute; opacity:0; transition:opacity .15s;
    background:rgba(0,0,0,0.0);
  }
  .bild-wrap:hover .overlay-btn{ opacity:1; }
  .herz{ bottom:10px; left:10px; font-size:20px; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
  .lupe{ bottom:10px; right:10px; font-size:18px; color:white; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
  .bild-wrap .overlay-btn{ position:absolute; }

  .footer{ text-align:center; margin:36px 0 20px; color:var(--moss-deep); font-size:14px; }
  .download-bereich{ text-align:center; margin:30px auto 10px; padding:24px; max-width:500px; background:var(--sand-deep); border-radius:10px; }
  .download-bereich p{ font-size:14px; color:var(--moss-deep); margin-bottom:14px; }
  .download-bereich button{ padding:12px 26px; background:var(--moss); color:white; border:none; border-radius:6px; cursor:pointer; font-family:'Jost',sans-serif; font-size:15px; }
  .download-bereich button:hover{ background:var(--moss-deep); }
  .download-bereich button:disabled{ opacity:0.6; cursor:not-allowed; }

  .lightbox{ display:none; position:fixed; inset:0; background:rgba(20,19,15,0.94); z-index:100; align-items:center; justify-content:center; }
  .lightbox img{ max-width:90vw; max-height:85vh; }
  .lightbox-close{ position:absolute; top:22px; right:30px; color:white; font-size:34px; cursor:pointer; background:none; border:none; line-height:1; }
  .lightbox-nav{ position:absolute; top:50%; transform:translateY(-50%); background:none; border:none; color:white; font-size:44px; cursor:pointer; padding:10px 18px; opacity:0.7; }
  .lightbox-nav:hover{ opacity:1; }
  .lightbox-prev{ left:10px; }
  .lightbox-next{ right:10px; }

  @media (max-width:700px){
    .sidebar{ display:none; }
    .inhalt{ padding:20px; }
  }
</style>
</head>
<body>

<div id="login-wrapper" class="login-body">
  <div class="logo"><img src="../../images/logo.png" alt="Silvis Photography"></div>
  <div class="login-box" id="login-box">
    <p class="begruessung">Schön, dass ihr da seid!</p>
    <h1 id="galerie-titel-login">Galerie</h1>
    <p>Diese Galerie ist passwortgeschützt.</p>
    <input type="password" id="passwort-input" placeholder="Passwort">
    <button id="passwort-btn">Ansehen</button>
    <p id="fehler"></p>
  </div>
</div>

<div class="galerie-ansicht" id="galerie-ansicht">
  <div class="topbar"><img src="../../images/logo.png" alt="Silvis Photography"></div>

  <div class="haupt">
    <div class="sidebar">
      <span class="icon aktiv" id="icon-alle" title="Alle Bilder">▦</span>
      <span class="icon" id="icon-favoriten" title="Nur Favoriten">♡</span>
    </div>

    <div class="inhalt">
      <div class="hero" id="hero">
        <img id="hero-img" src="" alt="">
        <div class="hero-overlay">
          <h1 id="hero-titel"></h1>
          <p id="hero-untertitel"></p>
        </div>
      </div>

      <div class="titel-zeile" id="titel-zeile">
        <h1 id="galerie-titel"></h1>
        <span class="kundenname" id="kundenname"></span>
      </div>
      <p class="hinweis" id="hinweis">Markiere deine Favoriten mit ♥ — klick auf ein Bild zum Vergrößern</p>

      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="download-bereich" id="download-bereich" style="display:none;">
    <p>🎉 Deine finalen Bilder sind bereit! Lade deine ausgewählten Favoriten in voller Auflösung herunter.</p>
    <button id="download-alle-btn">Ausgewählte Bilder herunterladen</button>
  </div>

  <div class="footer"><p id="anzahl">0 Bilder markiert</p></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#8249;</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next">&#8250;</button>
</div>

<script type="module">
  import { db, storage } from "../firebase-config.js";
  import { collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('g');
  let galerieDocId = null;

  async function einfacherHash(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function galerieLaden() {
    const q = query(collection(db, 'galerien'), where('slug', '==', slug));
    const snapshot = await getDocs(q);
    if (snapshot.empty) {
      document.body.innerHTML = '<p style="text-align:center; margin-top:100px; font-family:Jost,sans-serif;">Galerie nicht gefunden.</p>';
      return;
    }
    const docSnap = snapshot.docs[0];
    galerieDocId = docSnap.id;
    const galerie = docSnap.data();
    document.getElementById('galerie-titel-login').textContent = galerie.titel;

    document.getElementById('passwort-btn').addEventListener('click', async () => {
      const eingabe = document.getElementById('passwort-input').value;
      const hash = await einfacherHash(eingabe);
      if (hash === galerie.passwortHash) {
        document.getElementById('login-wrapper').style.display = 'none';
        document.getElementById('galerie-ansicht').style.display = 'block';

        const begruessungText = galerie.kundeName
          ? `Hallo ${galerie.kundeName}! Schön, dass du da bist.`
          : `Schön, dass du da bist!`;

        if (galerie.coverImageUrl) {
          // Titelbild vorhanden -> großes Hero-Bild zeigen, schlichten Titel-Text ausblenden
          document.getElementById('hero').style.display = 'block';
          document.getElementById('hero-img').src = galerie.coverImageUrl;
          document.getElementById('hero-titel').textContent = galerie.titel;
          document.getElementById('hero-untertitel').textContent = begruessungText;
          document.getElementById('titel-zeile').style.display = 'none';
        } else {
          document.getElementById('galerie-titel').textContent = galerie.titel;
          if (galerie.kundeName) {
            document.getElementById('kundenname').textContent = galerie.kundeName;
          }
        }

        if (galerie.downloadFreigegeben === true) {
          document.getElementById('download-bereich').style.display = 'block';
        }

        bilderLaden();
      } else {
        document.getElementById('fehler').textContent = 'Falsches Passwort.';
      }
    });
  }
  galerieLaden();

  async function bilderLaden() {
    const snapshot = await getDocs(collection(db, 'galerien', galerieDocId, 'bilder'));

    // Download-Button: lädt alle favorisierten Original-Bilder (ohne Wasserzeichen) einzeln herunter
    document.getElementById('download-alle-btn').addEventListener('click', async () => {
      const btn = document.getElementById('download-alle-btn');
      const favoritenDocs = [];
      snapshot.forEach(docSnap => {
        if (docSnap.data().favorit) favoritenDocs.push(docSnap.data());
      });

      if (favoritenDocs.length === 0) {
        alert('Bitte markiere zuerst mindestens ein Bild mit ❤️.');
        return;
      }

      btn.disabled = true;
      for (let i = 0; i < favoritenDocs.length; i++) {
        btn.textContent = `Lade herunter... (${i + 1}/${favoritenDocs.length})`;
        const bild = favoritenDocs[i];
        try {
          const originalRef = ref(storage, `galerien/${galerieDocId}/original/${bild.dateiId}.jpg`);
          const url = await getDownloadURL(originalRef);
          const antwort = await fetch(url);
          const blob = await antwort.blob();
          const objektUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = objektUrl;
          link.download = `Silvis-Photography-${i + 1}.jpg`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(objektUrl);
          await new Promise(resolve => setTimeout(resolve, 400)); // kurze Pause zwischen Downloads
        } catch (err) {
          console.error('Download fehlgeschlagen für ein Bild:', err);
        }
      }
      btn.disabled = false;
      btn.textContent = 'Ausgewählte Bilder herunterladen';
    });

    const grid = document.getElementById('grid');
    let favoritenAnzahl = 0;
    const alleUrls = [];
    const alleBilder = [];

    snapshot.forEach(docSnap => {
      const b = docSnap.data();
      if (b.favorit) favoritenAnzahl++;
      alleUrls.push(b.previewUrl);
      alleBilder.push({ id: docSnap.id, daten: b, index: alleUrls.length - 1 });
    });

    document.getElementById('anzahl').textContent = `${favoritenAnzahl} Bilder markiert`;

    let nurFavoriten = false;

    function gridRendern() {
      grid.innerHTML = '';
      const anzuzeigen = nurFavoriten ? alleBilder.filter(b => b.daten.favorit) : alleBilder;

      if (nurFavoriten && anzuzeigen.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#9a9384; padding:40px 0;">Noch keine Favoriten markiert.</p>';
        return;
      }

      anzuzeigen.forEach(({ id, daten, index }) => {
        const div = document.createElement('div');
        div.className = 'bild-wrap';
        div.innerHTML = `
          <img src="${daten.previewUrl}" alt="" data-index="${index}">
          <span class="overlay-btn herz" data-id="${id}">${daten.favorit ? '❤️' : '♡'}</span>
          <span class="overlay-btn lupe">🔍</span>
        `;
        grid.appendChild(div);
      });

      herzEventsBinden();
      lightboxEventsBinden();
    }

    document.getElementById('icon-alle').addEventListener('click', () => {
      nurFavoriten = false;
      document.getElementById('icon-alle').classList.add('aktiv');
      document.getElementById('icon-favoriten').classList.remove('aktiv');
      gridRendern();
    });
    document.getElementById('icon-favoriten').addEventListener('click', () => {
      nurFavoriten = true;
      document.getElementById('icon-favoriten').classList.add('aktiv');
      document.getElementById('icon-alle').classList.remove('aktiv');
      gridRendern();
    });

    gridRendern();

    function herzEventsBinden() {
      document.querySelectorAll('.herz').forEach(herz => {
        herz.addEventListener('click', async (e) => {
          e.stopPropagation();
          const bildId = herz.dataset.id;
          const bildDoc = alleBilder.find(b => b.id === bildId);
          const bildRef = doc(db, 'galerien', galerieDocId, 'bilder', bildId);
          const aktuell = herz.textContent.trim() === '❤️';
          await updateDoc(bildRef, { favorit: !aktuell });
          bildDoc.daten.favorit = !aktuell; // lokalen Stand aktualisieren, damit Filter sofort stimmt

          const anzahlEl = document.getElementById('anzahl');
          let anzahl = parseInt(anzahlEl.textContent);
          anzahlEl.textContent = `${aktuell ? anzahl - 1 : anzahl + 1} Bilder markiert`;

          if (nurFavoriten && aktuell) {
            // Bild wird gerade aus der Favoriten-Ansicht entfernt -> neu rendern
            gridRendern();
          } else {
            herz.textContent = aktuell ? '♡' : '❤️';
          }
        });
      });
    }

    let aktuellerIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function lightboxZeigen(index) {
      aktuellerIndex = index;
      lightboxImg.src = alleUrls[index];
      lightbox.style.display = 'flex';
    }

    function lightboxEventsBinden() {
      document.querySelectorAll('.bild-wrap img').forEach(img => {
        img.addEventListener('click', () => lightboxZeigen(parseInt(img.dataset.index)));
      });
    }

    document.getElementById('lightbox-close').addEventListener('click', () => { lightbox.style.display = 'none'; });
    document.getElementById('lightbox-prev').addEventListener('click', () => {
      aktuellerIndex = (aktuellerIndex - 1 + alleUrls.length) % alleUrls.length;
      lightboxImg.src = alleUrls[aktuellerIndex];
    });
    document.getElementById('lightbox-next').addEventListener('click', () => {
      aktuellerIndex = (aktuellerIndex + 1) % alleUrls.length;
      lightboxImg.src = alleUrls[aktuellerIndex];
    });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.style.display = 'none'; });
    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display !== 'flex') return;
      if (e.key === 'Escape') lightbox.style.display = 'none';
      if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
      if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
    });
  }
</script>

</body>
</html>
